<title>IQ Mahjong</title>
<style>
  :root{
    --felt:#0e4a3a;--felt-dk:#03211a;
    --ivory:#fdf8ea;--ivory-2:#f2e5c4;--edge:#d8b57c;--edge-dk:#a07d43;
    --gold:#f2bd58;--wood:#8a5427;--wood-dk:#3a1f0d;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    position:fixed;inset:0;
    font-family:"SF Pro Text","Segoe UI",system-ui,sans-serif;color:#f4ead2;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;
    background:radial-gradient(135% 75% at 50% -12%, #22886b 0%, var(--felt) 44%, var(--felt-dk) 100%);
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* bladskygger som på et rigtigt spillebord */
  body::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(60% 40% at 8% 4%, rgba(0,0,0,.30), transparent 70%),
      radial-gradient(50% 32% at 96% 12%, rgba(0,0,0,.26), transparent 70%),
      repeating-linear-gradient(41deg, rgba(255,255,255,.03) 0 1px, transparent 1px 4px);}
  body::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 150px rgba(0,0,0,.6)}

  /* ---------- IQ-måler ---------- */
  #hud{position:relative;z-index:6;padding:8px 12px 2px;display:flex;align-items:center;gap:10px}
  .lvl{flex:0 0 auto;display:grid;place-items:center;width:52px;height:52px;border-radius:16px;
    background:radial-gradient(circle at 35% 28%,#a56c2c,#5d3415);
    box-shadow:0 4px 0 var(--wood-dk),inset 0 2px 0 rgba(255,214,150,.4);
    font-size:9px;letter-spacing:.6px;color:#e9c78e;line-height:1.1;text-align:center}
  .lvl b{display:block;font-size:19px;color:#fff2d4}
  .iq{flex:1;min-width:0}
  .marks{display:flex;justify-content:space-between;font-size:15px;font-weight:800;
    color:#fff3d6;text-shadow:0 2px 3px rgba(0,0,0,.55);padding:0 2px 3px;font-variant-numeric:tabular-nums}
  .marks span{flex:1;text-align:right}
  .marks .brainy{display:inline-flex;align-items:center;gap:4px}
  .track{position:relative;height:13px;border-radius:99px;
    background:linear-gradient(180deg,#3d1c0c,#5c2f14);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.08)}
  .track i{position:absolute;top:-4px;width:2px;height:21px;background:rgba(0,0,0,.45);border-radius:2px}
  #iqfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;
    background:linear-gradient(180deg,#ffd77e,#f0a32c 60%,#d9822b);
    box-shadow:0 0 10px rgba(242,163,44,.55);transition:width .45s cubic-bezier(.3,1,.4,1)}
  #rank{font-size:10px;letter-spacing:1px;color:#9fc4b1;padding:4px 2px 0}
  .chipPts{flex:0 0 auto;display:grid;place-items:center;min-width:58px;padding:6px 9px;border-radius:13px;
    background:linear-gradient(180deg,#8a5327,#5c3315);border:2px solid #d8ab6a;
    box-shadow:0 4px 0 #3f2210;text-align:center}
  .chipPts span{font-size:8px;letter-spacing:.8px;color:#e9c78e}
  .chipPts b{font-size:17px;color:#ffd77e;font-variant-numeric:tabular-nums;line-height:1.1}
  #sound{flex:0 0 auto;background:none;border:none;color:#8fb3a2;font-size:17px;padding:2px 0 2px 4px;align-self:center}

  /* ---------- bræt ---------- */
  #viewport{flex:1;position:relative;display:flex;justify-content:center;align-items:center;min-height:0;z-index:4}
  #scaler{transform-origin:center center}
  #stage{position:relative}

  #trayFrame{position:absolute;border-radius:26px;
    background:linear-gradient(180deg,#c99251 0%,#c08a4d 4%,#a5703a 13%,#8b5a2c 45%,#6d4320 78%,#4f2f18 100%);
    box-shadow:inset 0 3px 0 rgba(255,224,178,.75),inset 0 -6px 10px rgba(0,0,0,.45),
      0 9px 0 #351c0b,0 18px 26px rgba(0,0,0,.55)}
  .slot{position:absolute;border-radius:15px;
    background:radial-gradient(120% 130% at 50% 0%,#31190a 0%,#4a2a13 62%,#5a3419 100%);
    box-shadow:inset 0 7px 11px rgba(0,0,0,.8),inset 0 -3px 4px rgba(255,190,120,.10),
      0 1px 0 rgba(255,205,150,.22)}

  /* brik: kant + fordybet forside, som en rigtig mahjongbrik */
  .tile{position:absolute;left:0;top:0;border-radius:10px;
    background:linear-gradient(150deg,#f6e3b8 0%,var(--edge) 55%,var(--edge-dk) 100%);
    padding:1px 3px 5px 1px;
    box-shadow:0 6px 8px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.35) inset;
    transition:transform .26s cubic-bezier(.2,.85,.25,1),opacity .2s,filter .2s;
    will-change:transform}
  .tile .face{width:100%;height:100%;border-radius:8px;overflow:hidden;position:relative;
    background:linear-gradient(168deg,#fffdf6 0%,var(--ivory) 42%,var(--ivory-2) 100%);
    box-shadow:inset 0 2px 3px rgba(255,255,255,.9),inset 0 -3px 5px rgba(160,125,67,.25)}
  .tile svg{display:block;width:100%;height:100%}
  .tile.locked{filter:brightness(.58) saturate(.75)}
  .tile.gold{background:linear-gradient(150deg,#ffd98a,#c07a1a)}
  .tile.gold .face{background:linear-gradient(168deg,#ffc978 0%,#f79c2a 45%,#dd7c14 100%)}
  .tile .x2{position:absolute;right:-3px;top:5px;background:linear-gradient(180deg,#e0392c,#9d1f18);
    color:#fff;font-size:9px;font-weight:800;padding:2px 5px;border-radius:3px;
    box-shadow:0 2px 3px rgba(0,0,0,.45);letter-spacing:.3px}
  @keyframes wob{0%,100%{rotate:0deg}30%{rotate:-4deg}70%{rotate:4deg}}

    g.gain.setValueAtTime(v||.09,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
    o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}
const buzz=m=>{if(navigator.vibrate)navigator.vibrate(m);};

/* ================= IQ ================= */
const RANKS=[[0,"r0"],[40,"r1"],[90,"r2"],[180,"r3"],[300,"r4"],[450,"r5"],[650,"r6"],[900,"r7"]];
function thresholds(){
  const t=[40,90,180];
  while(t[t.length-1]<IQ+1200) t.push(Math.round(t[t.length-1]*1.55/10)*10);
  return t;
}
function updateIQ(){
  const t=thresholds();
  let i=0; while(i<t.length&&IQ>=t[i]) i++;
  const base=i===0?0:t[i-1];
  const m=[t[i],t[i+1],t[i+2]];
  document.getElementById("m1").textContent=m[0];
  document.getElementById("m2").textContent=m[1];
  document.getElementById("m3").textContent=m[2];
  let pct;
  if(IQ<m[0]) pct=(IQ-base)/(m[0]-base)*33.3;
  else if(IQ<m[1]) pct=33.3+(IQ-m[0])/(m[1]-m[0])*33.3;
  else pct=66.6+(IQ-m[1])/(m[2]-m[1])*33.4;
  document.getElementById("iqfill").style.width=Math.max(2,Math.min(100,pct))+"%";
  let rank=RANKS[0][1]; RANKS.forEach(r=>{if(IQ>=r[0]) rank=r[1];});
  document.getElementById("rank").textContent="IQ "+IQ+" · "+T(rank);
  return rank;
}
function addIQ(n){
  const before=updateIQ();
  IQ+=n;
  const after=updateIQ();
  if(after!==before) toast(T("newRank",{r:T(after),iq:IQ}));
}
function praise(isGold){
  const left=G.tiles.filter(x=>x.state!=="gone").length, done=G.total-left, k=G.streak;
  if(left===2){ toast(T("last")); return; }
  if(isGold){ toast(T("gold")); return; }
  if(k===1&&done===2){ toast(T("start")); return; }
  if(!G.halfSaid&&done>=G.total/2){ G.halfSaid=true; toast(T("half")); return; }
  if(k>=5&&k%5===0){ toast(T("combo",{k})); return; }
  if(k===12||(k>12&&k%5===0)) toast(T("p12"));
  else if(k===8) toast(T("p8"));
  else if(k===5) toast(T("p5"));
  else if(k===3) toast(T("p3"));
}
function toast(txt){
  toastEl.textContent=txt;
  toastEl.animate([{opacity:0,transform:"translate(-50%,10px)"},{opacity:1,transform:"translate(-50%,0)"},
    {opacity:1,transform:"translate(-50%,0)"},{opacity:0,transform:"translate(-50%,-10px)"}],
    {duration:2200,easing:"ease"});
}

/* ================= sværhedsgrad ================= */
function difficulty(n){
  return {
    layers:Math.min(3+Math.floor((n-1)/2),8),
    cols:Math.min(6+Math.floor((n-1)/3),8),     /* smalt braet - telefoner er hoeje */
    rows:Math.min(6+Math.floor((n-1)/2),10),
    tiles:Math.min(60+(n-1)*10,180),            /* stort bræt fra start */
    kinds:Math.min(20+n*2,KEYS.length),         /* mindst 20 forskellige motiver i spil */
    hole:Math.max(.10-n*.012,.02),
    window:Math.min(2+Math.floor(n/4),3),
    undos:Math.max(5-Math.floor((n-1)/4),1),
    shuffles:Math.max(3-Math.floor((n-1)/5),1),
    hints:Math.max(3-Math.floor((n-1)/6),0)
  };
}

/* ================= bane ================= */
function buildPositions(n){
  const d=difficulty(n);
  let pos=[];
  for(let k=0;k<d.layers;k++){
    const c=d.cols-k,r=d.rows-k; if(c<1||r<1) break;
    for(let i=0;i<c;i++) for(let j=0;j<r;j++){
      const x=k+i*2,y=k+j*2;
      if(k===0&&R()<d.hole) continue;
      if(k>0&&R()<d.hole+k*.03) continue;
      if(k>0&&!pos.some(p=>p.layer===k-1&&Math.abs(p.x-x)<2&&Math.abs(p.y-y)<2)) continue;
      pos.push({layer:k,x,y});
    }
  }
  while(pos.length>d.tiles||pos.length%2!==0){
    const top=Math.max(...pos.map(p=>p.layer));
    const cand=pos.filter(p=>p.layer===top);
    const v=cand[rnd(cand.length)];
    pos=pos.filter(p=>p!==v);
    if(pos.length<=2) break;
  }
  return pos;
}

/* gyldig rækkefølge: pil brikker af efter samme regler som spilleren har */
function removalOrder(pos){
  pos.forEach(p=>p.out=false);
  const live=()=>pos.filter(p=>!p.out);
  const covered=t=>live().some(o=>o.layer>t.layer&&Math.abs(o.x-t.x)<2&&Math.abs(o.y-t.y)<2);
  const side=(t,dx)=>live().some(o=>o.layer===t.layer&&o.x===t.x+dx&&Math.abs(o.y-t.y)<2);
  const order=[];
  while(order.length<pos.length){
    const free=live().filter(t=>!covered(t)&&(!side(t,-2)||!side(t,2)));
    if(!free.length){ shuffled(live()).forEach(p=>{p.out=true;order.push(p);}); break; }
    const p=free[rnd(free.length)];
    p.out=true; order.push(p);
  }
  pos.forEach(p=>delete p.out);
  return order;
}

function generate(n){
  const d=difficulty(n);
  const pos=buildPositions(n);
  const order=removalOrder(pos);
  const palette=shuffled(KEYS).slice(0,d.kinds);
  let i=0;
  while(i<order.length){
    const size=Math.min(d.window*2,order.length-i);
    const kinds=shuffled(palette).slice(0,size/2);
    let bag=[];
    kinds.forEach(s=>{const g=R()<.07;bag.push({s,g},{s,g});});
    bag=shuffled(bag);
    for(let j=0;j<size;j++){ order[i+j].sym=bag[j].s; order[i+j].gold=bag[j].g; }
    i+=size;
  }
  const tiles=pos.map((p,idx)=>({id:idx,layer:p.layer,x:p.x,y:p.y,sym:p.sym,gold:!!p.gold,state:"board",el:null}));

  let minL=1e9,minT=1e9,maxR=-1e9,maxB=-1e9;
  tiles.forEach(t=>{
    const l=t.x*HW-t.layer*LIFT,tp=t.y*HH-t.layer*LIFT;
    minL=Math.min(minL,l);minT=Math.min(minT,tp);
    maxR=Math.max(maxR,l+TW);maxB=Math.max(maxB,tp+TH);
  });
  const boardW=maxR-minL,boardH=maxB-minT;
  const trayW=SLOTS*TW+(SLOTS+1)*GAP,trayH=TH+GAP*2;
  const stageW=Math.max(boardW,trayW),stageH=boardH+26+trayH;

  return {level:n,tiles,tray:[],history:[],startIQ:IQ,
    undos:d.undos,shuffles:d.shuffles,hints:d.hints,
    minL,minT,boardOff:(stageW-boardW)/2,trayOff:(stageW-trayW)/2,
    trayY:boardH+26,stageW,stageH,total:tiles.length};
}

/* ================= tegning ================= */
const boardPos=t=>({x:G.boardOff+t.x*HW-t.layer*LIFT-G.minL,y:t.y*HH-t.layer*LIFT-G.minT});
const slotPos=i=>({x:G.trayOff+GAP+i*(TW+GAP),y:G.trayY+GAP});

function render(){
  stage.innerHTML="";
  stage.style.width=G.stageW+"px";stage.style.height=G.stageH+"px";
  const f=document.createElement("div");f.id="trayFrame";
  f.style.cssText=`left:${G.trayOff}px;top:${G.trayY}px;width:${SLOTS*TW+(SLOTS+1)*GAP}px;height:${TH+GAP*2}px`;
  stage.appendChild(f);
  for(let i=0;i<SLOTS;i++){
    const s=document.createElement("div"),p=slotPos(i);
    s.className="slot";s.style.cssText=`left:${p.x}px;top:${p.y}px;width:${TW}px;height:${TH}px`;
    stage.appendChild(s);
  }
  G.tiles.forEach(t=>{
    const el=document.createElement("div");
    el.className="tile"+(t.gold?" gold":"");
    el.style.width=TW+"px";el.style.height=TH+"px";
    el.innerHTML=`<div class="face">${faceSVG(t.sym)}${t.gold?'<span class="x2">x2</span>':''}</div>`;
    el.addEventListener("pointerdown",e=>{e.preventDefault();tap(t);});
    t.el=el;stage.appendChild(el);
  });
  layout();fit();
}

const onBoard=()=>G.tiles.filter(t=>t.state==="board");
const covered=t=>onBoard().some(o=>o.layer>t.layer&&Math.abs(o.x-t.x)<2&&Math.abs(o.y-t.y)<2);
const sideBlocked=(t,dx)=>onBoard().some(o=>o.layer===t.layer&&o.x===t.x+dx&&Math.abs(o.y-t.y)<2);
/* fri = ingen brik ovenpå, og fri i venstre eller højre side */
const isFree=t=>!covered(t)&&(!sideBlocked(t,-2)||!sideBlocked(t,2));

function layout(){
  G.tiles.forEach(t=>{
    const el=t.el;if(!el)return;
    if(t.state==="gone"){el.style.display="none";return;}
    el.style.display="block";
    if(t.state==="board"){
      const p=boardPos(t);
      el.style.transform=`translate(${p.x}px,${p.y}px)`;
      el.style.zIndex=100+t.layer*1000+t.y*10;
      el.classList.toggle("locked",!isFree(t));
    }else{
      const i=G.tray.indexOf(t),p=slotPos(i);
      el.style.transform=`translate(${p.x}px,${p.y}px)`;
      el.style.zIndex=9000+i;el.classList.remove("locked");
    }
  });
  document.getElementById("lvl").textContent=G.level;
  document.getElementById("ptsVal").textContent=PTS.toLocaleString(window.LANG||"da");
  document.getElementById("ptsLbl").textContent=T("points");
  document.getElementById("undoN").textContent=G.undos;
  document.getElementById("shufN").textContent=G.shuffles;
  document.getElementById("hintN").textContent=G.hints;
  document.getElementById("undoBtn").disabled=G.undos<=0||!G.history.length;
  document.getElementById("shufBtn").disabled=G.shuffles<=0;
  document.getElementById("hintBtn").disabled=G.hints<=0;
  updateIQ();
}

function fit(){
  const w=viewport.clientWidth-4,h=viewport.clientHeight-4;
  scaler.style.transform=`scale(${Math.min(2.1,w/G.stageW,h/G.stageH)})`;
}
addEventListener("resize",()=>{if(G)fit();});
addEventListener("orientationchange",()=>setTimeout(()=>{if(G)fit();},250));

function sparks(x,y,n){
  for(let i=0;i<(n||9);i++){
    const s=document.createElement("div");s.className="spark";
    s.style.left=x+"px";s.style.top=y+"px";stage.appendChild(s);
    const a=Math.random()*6.28,d=24+Math.random()*30;
    s.animate([{transform:"translate(0,0) scale(1)",opacity:1},
      {transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(0)`,opacity:0}],
      {duration:520,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish=()=>s.remove();
  }
}
function floatScore(x,y,txt){
  const d=document.createElement("div");d.className="float";d.textContent=txt;
  d.style.left=x+"px";d.style.top=y+"px";stage.appendChild(d);
  d.animate([{transform:"translateY(0)",opacity:1},{transform:"translateY(-44px)",opacity:0}],
    {duration:720,easing:"ease-out"}).onfinish=()=>d.remove();
}

/* ================= spillets gang ================= */
function snapshot(){
  G.history.push({states:G.tiles.map(t=>t.state),tray:G.tray.map(t=>t.id),iq:IQ});
  if(G.history.length>120)G.history.shift();
}

function tap(t){
  if(busy||t.state!=="board"||overlay.classList.contains("on"))return;
  if(!isFree(t)){
    t.el.classList.remove("wob");void t.el.offsetWidth;t.el.classList.add("wob");
    beep(150,.12,"square",.05);buzz(18);return;
  }
  snapshot();
  t.state="tray";
  let idx=G.tray.length;
  for(let i=G.tray.length-1;i>=0;i--) if(G.tray[i].sym===t.sym){idx=i+1;break;}
  G.tray.splice(idx,0,t);
  layout();beep(520,.07);buzz(10);

  const same=G.tray.filter(x=>x.sym===t.sym);
  if(same.length>=2){
    const pair=same.slice(0,2);busy=true;
    pair.forEach(x=>x.el.classList.add("flash"));
    [700,940].forEach((f,i)=>setTimeout(()=>beep(f,.13,"sine",.11),i*70));
    buzz([12,35]);
    setTimeout(()=>{
      const p=slotPos(G.tray.indexOf(pair[0]));
      const isGold=pair[0].gold&&pair[1].gold;
      pair.forEach(x=>{x.state="gone";G.tray.splice(G.tray.indexOf(x),1);});
      const pts=(2+Math.floor(G.level/2))*(isGold?2:1);
      addIQ(pts);
      G.streak=(G.streak||0)+1;
      const chain=Math.min(1+(G.streak-1)*0.25,4);
      const score=Math.round((50+G.level*10)*chain*(isGold?2:1));
      PTS+=score; if(PTS>BEST&&!(window.DUEL&&window.DUEL.on)) BEST=PTS;
      sparks(p.x+TW,p.y+TH/2,isGold?16:9);
      floatScore(p.x+4,p.y,(isGold?"x2  +":"+")+score);
      praise(isGold);
      layout();save();
      if(window.LB&&window.LB.push) window.LB.push();
      busy=false;
      if(G.tiles.every(x=>x.state==="gone"))setTimeout(levelDone,300);
    },240);
    return;
  }
  if(G.tray.length>=SLOTS)setTimeout(gameOver,320);
}

function undo(){
  if(busy||!G.history.length||G.undos<=0)return;
  const h=G.history.pop();
  G.tiles.forEach((t,i)=>t.state=h.states[i]);
  G.tray=h.tray.map(id=>G.tiles[id]);
  IQ=h.iq;G.undos--;G.streak=0;save();
  overlay.classList.remove("on");layout();beep(340,.09);
}

function hint(){
  if(busy||G.hints<=0)return;
  const free=onBoard().filter(isFree);
  const trayS={};G.tray.forEach(t=>trayS[t.sym]=t);
  let pick=free.find(t=>trayS[t.sym]);
  if(!pick){
    for(const a of free){ if(free.some(b=>b!==a&&b.sym===a.sym)){pick=a;break;} }
  }
  if(!pick)pick=free[0];
  if(!pick)return;
  G.hints--;layout();
  const p=boardPos(pick);
  sparks(p.x+TW/2,p.y+TH/2,12);
  pick.el.classList.remove("flash");void pick.el.offsetWidth;pick.el.classList.add("flash");
  beep(760,.14,"sine");
}

function doShuffle(){
  if(busy||G.shuffles<=0)return;
  snapshot();G.shuffles--;G.streak=0;
  const board=onBoard();
  const order=removalOrder(board.map(t=>({layer:t.layer,x:t.x,y:t.y,ref:t})));
  const count={},goldOf={};
  board.forEach(t=>{count[t.sym]=(count[t.sym]||0)+1;goldOf[t.sym]=goldOf[t.sym]||t.gold;});
  const pairs=[],rest=[];
  Object.keys(count).forEach(s=>{
    const n=count[s];
    for(let i=0;i+2<=n;i+=2)pairs.push([s,s]);
    if(n%2)rest.push([s]);
  });
  const bag=[].concat.apply([],rest.concat(shuffled(pairs)));
  order.forEach((o,i)=>{
    const t=o.ref,s=bag[i];
    t.sym=s;t.gold=!!goldOf[s];
    t.el.className="tile"+(t.gold?" gold":"");
    t.el.innerHTML=`<div class="face">${faceSVG(s)}${t.gold?'<span class="x2">x2</span>':''}</div>`;
  });
  layout();beep(420,.12,"sine");buzz(20);
}

function levelDone(){
  const bonus=500*G.level;
  PTS+=bonus; if(PTS>BEST&&!(window.DUEL&&window.DUEL.on)) BEST=PTS;
  toast(T("lvlBonus",{p:bonus}));
  save(); if(window.LB) window.LB.submit();
  const d=difficulty(G.level+1);
  show(`<h2>${T("lvlDoneT",{n:G.level})}</h2>
        <p>${T("lvlDoneB",{iq:IQ,m:G.level+1,tiles:d.tiles,layers:d.layers,kinds:d.kinds})}</p>
        <p style="font-size:22px;font-weight:800;color:#ffd77e;margin-bottom:14px">${T("points")}: ${PTS.toLocaleString(window.LANG||"da")}</p>
        <button id="n">${T("playOn")}</button>
        <button class="ghost" id="s">${T("shareMine")}</button>
        <button class="ghost" id="h">${T("toHome")}</button>`,{n:()=>startLevel(G.level+1),s:()=>{startLevel(G.level+1);if(window.LB)window.LB.share();},
 h:()=>{startLevel(G.level+1);if(window.LB)window.LB.home();}});
  [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.22,"sine",.1),i*110));
}

function gameOver(){
  if(G.tray.length<SLOTS||overlay.classList.contains("on"))return;
  beep(180,.4,"sawtooth",.07);buzz([30,60,30]);
  save();
  if(window.LB) window.LB.submit();
  if(window.DUEL&&window.DUEL.on){
    show(`<h2>${T("duelResultT")}</h2><p>${T("duelResultB",{c:window.DUEL.code,iq:IQ,n:G.level})}</p>
      <button id="s">${T("shareBtn")}</button>
      <button class="ghost" id="e">${T("endDuel")}</button>`,
      {s:()=>{ window.DUELUI.share(IQ,G.level); },
       e:()=>{ window.DUELUI.end(); }});
    return;
  }
  const canUndo=G.undos>0&&G.history.length>0;
  show(`<h2>${T("overT")}</h2>
        <p>${T("overB",{iq:G.startIQ})}</p>
        <p style="font-size:22px;font-weight:800;color:#ffd77e;margin-bottom:14px">${T("points")}: ${PTS.toLocaleString(window.LANG||"da")}</p>
        ${canUndo?'<button id="u">'+T("undoLast")+'</button>':''}
        <button class="ghost" id="s">${T("shareMine")}</button>
        <button class="ghost" id="r">${T("retryLvl",{n:G.level})}</button>`,
    {u:undo,s:()=>{if(window.LB)window.LB.share();},
     r:()=>{IQ=G.startIQ;SEED=newSeed();startLevel(G.level);}});
}

function show(html,handlers){
  card.innerHTML=html;overlay.classList.add("on");
  Object.keys(handlers).forEach(id=>{
    const b=document.getElementById(id);
    if(b)b.onclick=()=>{overlay.classList.remove("on");handlers[id]();};
  });
}

function startLevel(n){
  const duel=window.DUEL&&window.DUEL.on;
  if(!duel&&!SEED) SEED=newSeed();
  setSeed(duel?window.DUEL.code:SEED,n);
  G=generate(n);busy=false;

  if(!duel&&RESTORE&&RESTORE.level===n&&RESTORE.states&&RESTORE.states.length===G.tiles.length){
    const r=RESTORE;
    G.tiles.forEach((t,i)=>{ t.state=r.states[i]==="g"?"gone":(r.states[i]==="t"?"tray":"board"); });
    G.tray=(r.tray||[]).map(id=>G.tiles[id]).filter(Boolean);
    G.undos=r.undos!==undefined?r.undos:G.undos;
    G.shuffles=r.shuffles!==undefined?r.shuffles:G.shuffles;
    G.hints=r.hints!==undefined?r.hints:G.hints;
    G.startIQ=r.startIQ!==undefined?r.startIQ:IQ;
  }
  RESTORE=null;
  render();save();
}

function save(){
  if(!G) return;
  if(window.DUEL&&window.DUEL.on) return;      /* en dyst overskriver ikke den rigtige gemning */
  const data=JSON.stringify({level:G.level,iq:IQ,pts:PTS,best:BEST,seed:SEED,
    states:G.tiles.map(t=>t.state==="gone"?"g":(t.state==="tray"?"t":"b")).join(""),
    tray:G.tray.map(t=>t.id),undos:G.undos,shuffles:G.shuffles,hints:G.hints,
    startIQ:G.startIQ,t:Date.now()});
  try{ if(window.storage) window.storage.set("iq:save",data); }catch(e){}
  try{ localStorage.setItem("iq:save",data); }catch(e){}
}
async function load(){
  let a=null,b=null;
  try{ if(window.storage){ const r=await window.storage.get("iq:save"); if(r&&r.value) a=JSON.parse(r.value); } }catch(e){}
  try{ const v=localStorage.getItem("iq:save"); if(v) b=JSON.parse(v); }catch(e){}
  if(a&&b) return (b.t||0)>(a.t||0)?b:a;       /* nyeste gemning vinder */
  return a||b;
}

document.getElementById("undoBtn").onclick=undo;
document.getElementById("shufBtn").onclick=doShuffle;
document.getElementById("hintBtn").onclick=hint;
document.getElementById("sound").onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?"🔊":"🔈";if(soundOn)beep(600,.08);};
document.addEventListener("gesturestart",e=>e.preventDefault());
addEventListener("visibilitychange",()=>{ if(document.hidden) save(); });
addEventListener("pagehide",save);
addEventListener("beforeunload",save);

async function resumeSaved(){
  const d=await load();
  if(d){
    IQ=d.iq||0; PTS=d.pts||0; BEST=d.best||d.pts||0; SEED=d.seed||newSeed();
    if(d.states) RESTORE={level:d.level,states:d.states.split(""),tray:d.tray,
      undos:d.undos,shuffles:d.shuffles,hints:d.hints,startIQ:d.startIQ};
  }else{ IQ=0;PTS=0;SEED=newSeed();RESTORE=null; }
  startLevel(d&&d.level?d.level:1);
  if(window.LB&&window.LB.refresh) window.LB.refresh();
}
resumeSaved();

window.GAME={start:startLevel,setIQ:v=>{IQ=v;},pts:()=>PTS,best:()=>BEST,save:save,
  restore:d=>{ IQ=+d.iq||0; PTS=+d.pts||0; BEST=Math.max(+d.best||0,PTS);
    SEED=newSeed(); RESTORE=null; startLevel(Math.max(1,+d.level||1)); save(); },
  enterDuel:code=>{ save(); window.DUEL={on:true,code}; IQ=0;PTS=0;RESTORE=null; startLevel(1); },
  exitDuel:()=>{ window.DUEL={on:false,code:""}; return resumeSaved(); },reset:()=>{IQ=0;PTS=0;SEED=newSeed();RESTORE=null;startLevel(1);},level:()=>G?G.level:1,iq:()=>IQ,rank:()=>document.getElementById('rank').textContent.split('· ')[1]||''};
})();
</script>

<script>
/* ================= forside + fælles topliste ================= */
(function(){
"use strict";
const homeEl=document.getElementById("home"),boardEl=document.getElementById("board");
const LB_KEY="leaderboard", ME_KEY="me";
let me={id:null,name:""},cache=[],cloud=null;

/* ---------- fælles topliste via Firestore (REST, ingen SDK) ---------- */
function fsBase(){ return "https://firestore.googleapis.com/v1/projects/"+cloud.proj+
  "/databases/(default)/documents/rooms/"+encodeURIComponent(cloud.room)+"/scores"; }
async function cloudPut(iq,lvl,pts){
  const body={fields:{name:{stringValue:me.name},iq:{integerValue:String(iq)},
    pts:{integerValue:String(arguments[2]||0)},
    level:{integerValue:String(lvl)},t:{integerValue:String(Date.now())}}};
  const r=await fetch(fsBase()+"/"+me.id+"?key="+cloud.key,
    {method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  return r.ok;
}
async function cloudList(){
  const r=await fetch(fsBase()+"?key="+cloud.key+"&pageSize=200");
  if(!r.ok) return [];
  const j=await r.json();
  return (j.documents||[]).map(d=>{
    const f=d.fields||{},id=d.name.split("/").pop();
    return {id,name:(f.name&&f.name.stringValue)||"?",
      iq:+((f.iq&&f.iq.integerValue)||0),pts:+((f.pts&&f.pts.integerValue)||0),
      level:+((f.level&&f.level.integerValue)||1)};
  }).sort((a,b)=>b.pts-a.pts||b.iq-a.iq).slice(0,50);
}

const st=()=>window.storage||null;
async function getJSON(key,shared,fallback){
  try{ if(st()){ const r=await st().get(key,shared); if(r&&r.value) return JSON.parse(r.value); } }catch(e){}
  try{ const v=localStorage.getItem("iq:"+key); if(v) return JSON.parse(v); }catch(e){}
  return fallback;
}
async function setJSON(key,val,shared){
  let ok=false;
  try{ if(st()){ await st().set(key,JSON.stringify(val),shared); ok=true; } }catch(e){}
  try{ localStorage.setItem("iq:"+key,JSON.stringify(val)); ok=true; }catch(e){}
  return ok;
}

async function loadMe(){
  me=await getJSON(ME_KEY,false,null)||{id:"p"+Math.random().toString(36).slice(2,9),name:""};
  if(!me.name) me.name="Spiller "+me.id.slice(1,4).toUpperCase();
  await setJSON(ME_KEY,me,false);
}

async function submit(){
  if(!window.GAME) return;
  if(window.DUEL&&window.DUEL.on) return;
  const iq=window.GAME.iq(),lvl=window.GAME.level(),pts=window.GAME.best();
  if(cloud&&cloud.proj&&cloud.room){            /* nøglen er valgfri — læsning og skrivning skal følges ad */
    try{
      const list=await cloudList();
      const mine=list.find(e=>e.id===me.id);
      if(!mine||pts>=(mine.pts||0)) await cloudPut(iq,lvl,pts);
      cache=await cloudList();
      paintHome();
    }catch(e){}
    return;
  }
  const list=await getJSON(LB_KEY,true,[]);
  const i=list.findIndex(e=>e.id===me.id);
  const entry={id:me.id,name:me.name,iq,pts,level:lvl,t:Date.now()};
  if(i<0) list.push(entry);
  else if(pts>=(list[i].pts||0)) list[i]=entry;
  list.sort((a,b)=>(b.pts||0)-(a.pts||0)||b.iq-a.iq);
  cache=list.slice(0,50);
  await setJSON(LB_KEY,cache,true);
  paintHome();
}

function paintRows(){
  const rows=document.getElementById("rows");
  if(!cache.length){ rows.innerHTML='<div class="row">Ingen har spillet endnu. Klar den første bane, så står du øverst.</div>'; return; }
  rows.innerHTML=cache.map((e,i)=>
    `<div class="row${e.id===me.id?" me":""}"><span class="n">${i+1}</span>
     <span class="nm">${e.name.replace(/[<>&]/g,"")}</span>
     <span class="iq">${(e.pts||0).toLocaleString(window.LANG||"da")}</span>
     <span style="opacity:.7;font-size:11px">IQ ${e.iq} · ${window.T("boardLevel",{n:e.level})}</span>
     <button class="del" data-id="${e.id}" data-name="${e.name.replace(/["<>&]/g,"")}"
       aria-label="Fjern">✕</button></div>`).join("");
  rows.querySelectorAll(".del").forEach(b=>{ b.onclick=ev=>{ ev.stopPropagation(); removeEntry(b.dataset.id,b.dataset.name); }; });
}

function paintHome(){
  if(!window.GAME) return;
  const lv=window.GAME.level();
  document.getElementById("playBtn").innerHTML=
    (lv>1||window.GAME.pts()>0)?window.T("resume",{n:lv}):window.T("levelBtn",{n:lv});
  document.getElementById("homeLvl") && (document.getElementById("homeLvl").textContent=window.GAME.level());
  const L=window.LANG||"da";
  document.getElementById("ptsWord").textContent=window.T("points");
  document.getElementById("homePts").textContent=window.GAME.pts().toLocaleString(L);
  document.getElementById("homeBest").textContent="★ "+window.GAME.best().toLocaleString(L);
  document.getElementById("homeIQ").textContent=window.GAME.iq();
  document.getElementById("homeRank").textContent=
    (window.DUEL&&window.DUEL.on)?window.T("duelOn",{c:window.DUEL.code}):
    (cloud&&cloud.proj?window.T("cloudOn",{r:cloud.room}):(window.GAME.rank()||window.T("r0")));
  document.getElementById("avatarLetter").textContent=(me.name||"?").trim().charAt(0).toUpperCase();
  const pos=cache.findIndex(e=>e.id===me.id);
  document.getElementById("homePos").textContent=pos<0?"#–":"#"+(pos+1);
}

async function removeEntry(id,name){
  if(!confirm(window.T("delAsk",{n:name}))) return;
  let ok=true;
  if(cloud&&cloud.proj){
    try{
      const r=await fetch(fsBase()+"/"+encodeURIComponent(id)+"?key="+cloud.key,{method:"DELETE"});
      ok=r.ok;
    }catch(e){ ok=false; }
  }
  cache=cache.filter(x=>x.id!==id);
  const list=(await getJSON(LB_KEY,true,[])).filter(x=>x.id!==id);
  await setJSON(LB_KEY,list,true);
  paintRows(); paintHome();
  alert(window.T(ok?"delOk":"delFail",{n:name}));
}

let pollTimer=null;
function startPolling(){
  stopPolling();
  if(!(cloud&&cloud.proj)) return;
  pollTimer=setInterval(async()=>{
    if(!boardEl.classList.contains("on")){ stopPolling(); return; }
    try{ await submit(); cache=await cloudList(); paintRows(); paintHome(); }catch(e){}
  },12000);
}
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

async function openBoard(){
  try{ await submit(); }catch(e){}
  cache=(cloud&&cloud.proj)?await cloudList():await getJSON(LB_KEY,true,cache);
  document.getElementById("cloudSetup").style.display=(cloud&&cloud.proj)?"none":"block";
  document.getElementById("cStatus").textContent="";
  document.getElementById("cProj").value=(cloud&&cloud.proj)||"";
  document.getElementById("cKey").value=(cloud&&cloud.key)||"";
  document.getElementById("cRoom").value=(cloud&&cloud.room)||"";
  document.getElementById("nameIn").value=me.name;
  paintRows(); boardEl.classList.add("on");
  if(cloud&&cloud.proj){
    document.getElementById("cStatus").textContent=window.T("cloudOn",{r:cloud.room});
    startPolling();
  }
}

document.getElementById("playBtn").onclick=()=>{ homeEl.classList.add("hidden"); };

const langBox=document.getElementById("langBox");
function paintLangs(){
  document.getElementById("langRows").innerHTML=Object.keys(window.LANG_NAMES).map(code=>
    `<div class="row${code===window.LANG?" me":""}" data-code="${code}">
       <span class="n">${code.toUpperCase()}</span><span class="nm">${window.LANG_NAMES[code]}</span></div>`).join("");
  document.querySelectorAll("#langRows .row").forEach(r=>{
    r.onclick=async()=>{
      window.LANG=r.dataset.code;
      await setJSON("lang",{code:window.LANG},false);
      window.applyI18N(); paintLangs(); paintHome(); paintRows();
    };
  });
}
document.getElementById("langBtn").onclick=()=>{ paintLangs(); langBox.classList.add("on"); };
/* ---------- sikkerhedskode: hele dit spil i én streng ---------- */
function backupCode(){
  const raw=[(cloud&&cloud.proj)||"",(cloud&&cloud.key)||"",(cloud&&cloud.room)||"",me.id,me.name].join("|");
  return "IQMJB."+btoa(unescape(encodeURIComponent(raw))).replace(/=+$/,"");
}
function readBackup(txt){
  const m=String(txt||"").match(/IQMJB\.([A-Za-z0-9+/=]+)/);
  if(!m) return null;
  try{
    const p=decodeURIComponent(escape(atob(m[1]))).split("|");
    if(p.length<5) return null;
    return {proj:p[0],key:p[1],room:p[2],id:p[3],name:p[4]};
  }catch(e){ return null; }
}
async function doRestore(txt){
  const b=readBackup(txt);
  if(!b){ alert(window.T("restoreBad")); return; }
  me={id:b.id,name:b.name||me.name};
  await setJSON(ME_KEY,me,false);
  if(b.proj){
    cloud={proj:b.proj,key:b.key,room:b.room||"familie"};
    await setJSON("cloud",cloud,false);
  }
  let mine=null;
  try{ mine=(await cloudList()).find(e=>e.id===me.id); }catch(e){}
  if(!mine){ alert(window.T("restoreNone")); paintHome(); return; }
  window.GAME.restore({iq:mine.iq,pts:mine.pts,best:mine.pts,level:mine.level});
  cache=await cloudList();
  paintRows(); paintHome();
  alert(window.T("restoreOk",{n:me.name,p:(mine.pts||0).toLocaleString(window.LANG||"da"),l:mine.level}));
}

/* ---------- invitationslink: én adresse, og man er med ---------- */
function inviteLink(){
  if(!cloud||!cloud.proj) return null;
  const raw=[cloud.proj,cloud.key,cloud.room].join("|");
  const tag=btoa(unescape(encodeURIComponent(raw))).replace(/=+$/,"");
  return location.origin+location.pathname+"?lb="+encodeURIComponent(tag);
}
async function readRestoreLink(){
  const m=(location.search+location.hash).match(/[?&#]rb=([^&#]+)/);
  if(!m) return false;
  history.replaceState(null,"",location.origin+location.pathname);
  await doRestore(decodeURIComponent(m[1]));
  return true;
}
async function readInvite(){
  const m=(location.search+location.hash).match(/[?&#]lb=([^&#]+)/);
  if(!m) return false;
  try{
    const parts=decodeURIComponent(escape(atob(decodeURIComponent(m[1])))).split("|");
    if(parts.length<3) return false;
    cloud={proj:parts[0],key:parts[1],room:parts[2]};
    await setJSON("cloud",cloud,false);
    history.replaceState(null,"",location.origin+location.pathname);
    return true;
  }catch(e){ return false; }
}

/* ---------- del point som en kode, uden server ---------- */
function myCode(){
  const raw=[me.id,me.name,window.GAME.best(),window.GAME.level(),window.GAME.iq()].join("|");
  return "IQMJ."+btoa(unescape(encodeURIComponent(raw))).replace(/=+$/,"");
}
function readCode(txt){
  const m=String(txt||"").match(/IQMJ\.([A-Za-z0-9+/=]+)/);
  if(!m) return null;
  try{
    const parts=decodeURIComponent(escape(atob(m[1]))).split("|");
    if(parts.length<5) return null;
    return {id:parts[0],name:parts[1],pts:+parts[2]||0,level:+parts[3]||1,iq:+parts[4]||0};
  }catch(e){ return null; }
}
async function shareMine(){
  const txt=window.T("shareScore",{n:me.name,p:window.GAME.best().toLocaleString(window.LANG||"da"),
    l:window.GAME.level(),i:window.GAME.iq(),c:myCode()});
  try{
    if(navigator.share) await navigator.share({text:txt});
    else { await navigator.clipboard.writeText(txt); alert(window.T("copied")); }
  }catch(e){}
}
document.getElementById("shareMine").onclick=shareMine;
document.getElementById("backupBtn").onclick=async()=>{
  const code=backupCode();
  const txt=window.T("backupTxt",{c:code});
  try{
    if(navigator.share) await navigator.share({text:txt});
    else { await navigator.clipboard.writeText(txt); alert(window.T("copied")); }
  }catch(e){ try{ await navigator.clipboard.writeText(txt); }catch(e2){} }
};
document.getElementById("restoreBtn").onclick=async()=>{
  const v=prompt(window.T("restoreAsk"));
  if(v) await doRestore(v);
};
document.getElementById("pasteCode").onclick=async()=>{
  const v=prompt(window.T("pasteAsk"));
  if(!v) return;
  const e=readCode(v);
  if(!e){ alert(window.T("pasteBad")); return; }
  const list=await getJSON(LB_KEY,true,[]);
  const i=list.findIndex(x=>x.id===e.id);
  if(i<0) list.push(e); else list[i]=e;
  list.sort((a,b)=>(b.pts||0)-(a.pts||0)||b.iq-a.iq);
  cache=list.slice(0,50);
  await setJSON(LB_KEY,cache,true);
  paintRows(); paintHome();
  alert(window.T("pasteOk",{n:e.name}));
};

document.getElementById("cloudToggle").onclick=()=>{
  const b=document.getElementById("cloudSetup");
  b.style.display=b.style.display==="none"?"block":"none";
};
document.getElementById("refreshBoard").onclick=async()=>{
  try{ await submit(); }catch(e){}
  cache=(cloud&&cloud.proj)?await cloudList():await getJSON(LB_KEY,true,cache);
  paintRows(); paintHome();
};
const cStatus=()=>document.getElementById("cStatus");
/* man må gerne klistre hele firebaseConfig-blokken ind — vi finder selv de to værdier */
function pickConfig(){
  const a=document.getElementById("cProj"), b=document.getElementById("cKey");
  const blob=a.value+" "+b.value;
  const k=blob.match(/AIza[0-9A-Za-z_\-]{20,}/);
  const pr=blob.match(/projectId\s*:\s*["']([^"']+)["']/)||blob.match(/authDomain\s*:\s*["']([^".']+)\./);
  if(k) b.value=k[0];
  if(pr) a.value=pr[1];
  else a.value=a.value.replace(/[{}"',]|projectId\s*:|apiKey\s*:/g,"").trim().split(/\s+/)[0]||a.value.trim();
}
document.getElementById("cSave").onclick=async()=>{
  pickConfig();
  cloud={proj:document.getElementById("cProj").value.trim(),
         key:document.getElementById("cKey").value.trim(),
         room:(document.getElementById("cRoom").value.trim()||"familie")};
  if(!cloud.room) cloud.room="familie";
  cStatus().textContent=window.T("connecting");
  try{
    const ok=await cloudPut(window.GAME.iq(),window.GAME.level(),window.GAME.best());
    if(!ok) throw new Error("afvist");
    await setJSON("cloud",cloud,false);
    cache=await cloudList();
    cStatus().textContent=window.T("cloudOk");
    paintRows(); paintHome();
  }catch(e){
    cStatus().textContent=window.T("cloudFail");
    cloud=await getJSON("cloud",false,null);
  }
};
document.getElementById("inviteBtn").onclick=async()=>{
  const u=inviteLink();
  if(!u){ cStatus().textContent=window.T("cloudFail"); return; }
  const txt=window.T("inviteTxt",{u});
  try{
    if(navigator.share) await navigator.share({text:txt});
    else { await navigator.clipboard.writeText(txt); alert(window.T("copied")); }
  }catch(e){}
};
document.getElementById("closeLang").onclick=()=>langBox.classList.remove("on");
document.getElementById("lbBtn").onclick=openBoard;
document.getElementById("closeBoard").onclick=()=>{ boardEl.classList.remove("on"); stopPolling(); };
document.getElementById("resetAll").onclick=async()=>{
  if(!confirm(window.T("resetAsk"))) return;
  window.GAME.reset(); window.GAME.save();
  boardEl.classList.remove("on");
  await submit(); paintHome(); homeEl.classList.remove("hidden");
};
document.getElementById("saveName").onclick=async()=>{
  const v=document.getElementById("nameIn").value.trim().slice(0,14);
  if(!v) return;
  me.name=v; await setJSON(ME_KEY,me,false); await submit(); paintRows(); paintHome();
};
document.getElementById("setBtn").onclick=()=>document.getElementById("sound").click();
document.getElementById("avatarBtn").onclick=openBoard;
document.querySelector(".lvl").onclick=()=>{ paintHome(); homeEl.classList.remove("hidden"); };

/* ---------- dyst: samme baner hos begge ---------- */
const duelBox=document.getElementById("duelBox");
function newCode(){ const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c=""; for(let i=0;i<6;i++)c+=a[Math.floor(Math.random()*a.length)]; return c; }
document.getElementById("duelBtn").onclick=()=>{
  window.applyI18N();
  const inp=document.getElementById("duelIn");
  if(!inp.value) inp.value=newCode();
  duelBox.classList.add("on");
};
document.getElementById("newCode").onclick=()=>{ document.getElementById("duelIn").value=newCode(); };
document.getElementById("closeDuel").onclick=()=>duelBox.classList.remove("on");
document.getElementById("startDuel").onclick=()=>{
  const code=(document.getElementById("duelIn").value||newCode()).trim().toUpperCase();
  window.GAME.enterDuel(code);
  duelBox.classList.remove("on");
  homeEl.classList.add("hidden");
};
window.DUELUI={
  async share(iq,lvl){
    const txt=window.T("shareText",{iq,n:lvl,c:window.DUEL.code});
    try{
      if(navigator.share) await navigator.share({text:txt});
      else { await navigator.clipboard.writeText(txt); alert(window.T("copied")); }
    }catch(e){}
  },
  async end(){
    await window.GAME.exitDuel();        /* dine egne point kommer uberørt tilbage */
    paintHome(); homeEl.classList.remove("hidden");
  }
};

function toastHome(txt){
  const t=document.getElementById("toast");
  if(!t) return;
  t.textContent=txt;
  t.animate([{opacity:0,transform:"translate(-50%,10px)"},{opacity:1,transform:"translate(-50%,0)"},
    {opacity:1,transform:"translate(-50%,0)"},{opacity:0,transform:"translate(-50%,-10px)"}],
    {duration:2800,easing:"ease"});
}
addEventListener("visibilitychange",async()=>{
  if(!(cloud&&cloud.proj)) return;
  try{
    if(document.hidden){ await submit(); return; }
    await submit(); cache=await cloudList(); paintRows(); paintHome();
  }catch(e){}
});
let lastPush=0,pushTimer=null;
function push(){
  const now=Date.now(), wait=Math.max(0,8000-(now-lastPush));
  if(pushTimer) return;
  pushTimer=setTimeout(async()=>{
    pushTimer=null; lastPush=Date.now();
    try{ await submit(); }catch(e){}
  },wait);
}
window.LB={submit,push,refresh:paintHome,share:shareMine,home:()=>{paintHome();homeEl.classList.remove("hidden");}};

(async function(){
  cloud=await getJSON("cloud",false,null);
  const invited=await readInvite();
  const restoring=(location.search+location.hash).indexOf("rb=")>=0;
  const saved=await getJSON("lang",false,null);
  if(saved&&saved.code&&window.I18N[saved.code]) window.LANG=saved.code;
  window.applyI18N();
  await loadMe();
  cache=await getJSON(LB_KEY,true,[]);
  setTimeout(async()=>{
    if(restoring){ await readRestoreLink(); return; }
    await submit(); paintRows(); paintHome();
    if(invited) toastHome(window.T("joined",{r:cloud.room}));
  },400);  /* du står altid selv på listen */
})();
})();
</script>

<script>
/* installerbar som app: gemmer spillet lokalt, så det virker uden net */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(r=>{
      r.addEventListener("updatefound",()=>{
        const w=r.installing;
        if(!w) return;
        w.addEventListener("statechange",()=>{
          if(w.state==="installed" && navigator.serviceWorker.controller) w.postMessage("skip");
        });
      });
    }).catch(()=>{});
    let reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{
      if(reloaded) return; reloaded=true; location.reload();
    });
  });
}
</script>
